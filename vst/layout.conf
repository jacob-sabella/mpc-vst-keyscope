# Keyscope skin. Theme: dark slate like a scope screen, mint for what is detected, amber for what is
# sounding now and the titles, a dim teal for frames.
# Four tabs, one Q-Link bank (4 controls) each: the MPC Key 37 has 4 physical Q-Links and its Q-Link
# sub-pages don't cycle, so a second bank would be unreachable there.
# Q-Links only get knob-safe controls: nothing that clears what was heard on a turn (RESET is a button).
style=td3
art_css=skin.css
label_scale=1.3
scale_names=1
theme_bg=0b1518
theme_box=0f2026
theme_ink=e6f4f1
theme_ink_dim=8fb3ad
theme_ink_faint=21403d
theme_accent=4be3b5
theme_accent_hi=ffb547
theme_seg_active=2a9c80
theme_seg_inactive=13302f
theme_seg_active_tx=ffffff
theme_lcd=08100f
theme_line=1f6158
theme_btn_bg=ffb547
theme_btn_text=0b1518
theme_display_ink=4be3b5
theme_panel=10262b
theme_knob_face=11292d
theme_knob_ring=2a9c80
theme_knob_dot=ffb547
theme_tab_on=ffb547
theme_tab_on_tx=0b1518
theme_chrome_ink=e6f4f1
theme_bar=10262b
theme_tile_on=6b4a12

[tab KEY]
# The key heard so far (MEMORY decides how far back), how well it matches, its relative and its notes.
# KEY = AUTO follows the audio; pick a key, or tap a candidate, to lock it (tap it again to follow again).
frame x=40 y=112 w=1200 h=196 title="KEY"
readout cx=380 cy=170 w=660 h=52 key=key_name
readout cx=380 cy=224 w=660 h=40 key=key_info
readout cx=380 cy=270 w=660 h=40 key=scale_notes
popup cx=1000 cy=176 w=380 h=48 label="KEY LOCK" key=lock cols=3
toggle cx=880 cy=246 label="HOLD" key=hold
button cx=1110 cy=262 label="RESET" key=reset
frame x=40 y=320 w=1200 h=124 title="CANDIDATES (TAP TO LOCK)"
list x=64 y=356 w=1152 h=72 cols=3 rows=1 th=72 gap=14 key=cand
# lit: the notes sounding now (the loudest half of what is heard)
frame x=40 y=456 w=1200 h=124 title="SOUNDING NOW"
list x=64 y=492 w=1152 h=72 cols=12 rows=1 th=72 gap=8 key=note
readout cx=360 cy=612 w=640 h=40 key=chord
readout cx=970 cy=612 w=540 h=40 key=outside
readout cx=640 cy=666 w=1200 h=36 key=status
qlinks "KEY" = lock,memory,gate,hold

[tab CHORDS]
# The chord heard now (held until a new one is clear, cleared after silence) and the ones before it.
frame x=40 y=112 w=1200 h=180 title="CHORD"
readout cx=640 cy=180 w=800 h=60 key=chord
readout cx=640 cy=250 w=1120 h=40 key=trail
frame x=40 y=304 w=1200 h=124 title="SOUNDING NOW"
list x=64 y=340 w=1152 h=72 cols=12 rows=1 th=72 gap=8 key=note
frame x=40 y=440 w=1200 h=150 title="DETECT"
enum_h cx=330 cy=530 sw=150 label="CHORDS" key=chords options="TRIADS,+ 7THS"
enum_h cx=900 cy=530 sw=130 label="RANGE" key=range options="FULL,BASS,MIDS,HIGHS"
readout cx=360 cy=626 w=640 h=40 key=key_name
readout cx=970 cy=626 w=540 h=40 key=loudest
readout cx=640 cy=676 w=1200 h=36 key=status
qlinks "CHORDS" = chords,range,gate,hold

[tab HISTORY]
# Key changes, newest first, with the time since listening started (or since RESET).
frame x=40 y=112 w=560 h=500 title="KEY CHANGES"
list x=64 y=150 w=512 h=444 cols=1 rows=6 th=64 gap=12 key=log
frame x=620 y=112 w=620 h=500 title="SO FAR"
readout cx=930 cy=176 w=580 h=48 key=key_name
readout cx=930 cy=228 w=580 h=40 key=key_info
readout cx=930 cy=290 w=580 h=40 key=trail
readout cx=930 cy=350 w=580 h=40 key=tuning_read
readout cx=930 cy=410 w=580 h=40 key=loudest
toggle cx=780 cy=500 label="HOLD" key=hold
button cx=1080 cy=516 label="RESET" key=reset
readout cx=640 cy=666 w=1200 h=36 key=status
qlinks "HISTORY" = memory,gate,hold,lock

[tab SETUP]
# MEMORY: how far back the key looks (SONG: everything since RESET). PROFILE: the key profile the notes
# heard are matched against. RANGE: the band analysed for the key and chord (BASS for a bassline, MIDS to keep
# drums and hi-hats out). GATE: quieter audio is ignored. TUNING AUTO follows a band that is not at A = 440.
frame x=40 y=112 w=1200 h=230 title="KEY DETECTION"
enum_h cx=330 cy=200 sw=130 label="MEMORY" key=memory options="10 S,30 S,1 MIN,SONG"
enum_h cx=900 cy=200 sw=170 label="PROFILE" key=profile options="KRUMHANSL,TEMPERLEY,SIMPLE"
enum_h cx=330 cy=300 sw=130 label="RANGE" key=range options="FULL,BASS,MIDS,HIGHS"
enum_h cx=900 cy=300 sw=150 label="NOTATION" key=notation options="AUTO,SHARPS,FLATS"
frame x=40 y=354 w=1200 h=250 title="INPUT"
knob cx=190 cy=470 r=50 label="GATE" key=gate
enum_h cx=560 cy=440 sw=160 label="TUNING" key=tuning options="AUTO,A = 440"
enum_h cx=960 cy=440 sw=150 label="CHORDS" key=chords options="TRIADS,+ 7THS"
readout cx=760 cy=530 w=860 h=40 key=tuning_read
readout cx=760 cy=574 w=860 h=36 key=status
readout cx=640 cy=666 w=1200 h=36 key=loudest
qlinks "SETUP" = memory,profile,range,gate
