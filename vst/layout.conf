list x=212 y=237 w=76 h=44 cols=1 rows=1 th=44 gap=0 key=ring_24
readout cx=330 cy=372 w=200 h=48 key=key_name
readout cx=330 cy=426 w=160 h=40 key=chord
frame x=660 y=104 w=580 h=124 title="KEY"
readout cx=950 cy=152 w=540 h=36 key=key_info
readout cx=950 cy=198 w=540 h=36 key=scale_notes
frame x=660 y=240 w=580 h=108 title="CANDIDATES (TAP TO LOCK)"
list x=680 y=276 w=540 h=56 cols=3 rows=1 th=56 gap=10 key=cand
