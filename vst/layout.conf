# Keyscope skin. Theme: a synthwave sunset. The KEY page is a circle of fifths drawn into the sun (vst/art/gen.py
# draws the backgrounds); pink for live text, orange for titles, red-magenta for lit tiles.
# Four tabs, one Q-Link bank (4 controls) each: the MPC Key 37 has 4 physical Q-Links and its Q-Link
# sub-pages don't cycle, so a second bank would be unreachable there.
# Q-Links only get knob-safe controls: nothing that clears what was heard on a turn (RESET is a button).
style=td3
art_css=skin.css
label_scale=1.3
scale_names=1
theme_bg=0a0520
theme_box=140a33
theme_ink=f6ecff
theme_ink_dim=c3a6e6
theme_ink_faint=3a2466
theme_accent=ff9cf0
theme_accent_hi=ffa040
theme_seg_active=e0287f
theme_seg_inactive=24103f
theme_seg_active_tx=ffffff
theme_lcd=0d0626
theme_line=8a3cd8
theme_btn_bg=ffa040
theme_btn_text=1a0630
theme_display_ink=ff9cf0
theme_panel=160b36
theme_knob_face=1c0f40
theme_knob_ring=8a3cd8
theme_knob_dot=ffa040
theme_tab_on=e0287f
theme_tab_on_tx=ffffff
theme_chrome_ink=f6ecff
theme_bar=160b36
theme_tile_on=7a0f4a

[tab KEY]
# The circle of fifths: major keys outside, clockwise from C a fifth apart, their relative minors inside. The key
# heard lights its six chords (I IV V outside, ii iii vi inside); its name and the chord now are in the middle.
# Tap a key on the wheel (or a candidate) to lock to it, tap it again to follow the audio again.
art file=art/wheel.svg
list x=282 y=122 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_1
list x=407 y=155 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_2
list x=499 y=247 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_3
list x=532 y=372 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_4
list x=499 y=497 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_5
list x=407 y=589 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_6
list x=282 y=622 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_7
list x=157 y=589 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_8
list x=65 y=497 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_9
list x=32 y=372 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_10
list x=65 y=247 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_11
list x=157 y=155 w=96 h=52 cols=1 rows=1 th=52 gap=0 key=ring_12
list x=292 y=216 w=76 h=44 cols=1 rows=1 th=44 gap=0 key=ring_13
list x=372 y=237 w=76 h=44 cols=1 rows=1 th=44 gap=0 key=ring_14
list x=431 y=296 w=76 h=44 cols=1 rows=1 th=44 gap=0 key=ring_15
list x=452 y=376 w=76 h=44 cols=1 rows=1 th=44 gap=0 key=ring_16
list x=431 y=456 w=76 h=44 cols=1 rows=1 th=44 gap=0 key=ring_17
list x=372 y=515 w=76 h=44 cols=1 rows=1 th=44 gap=0 key=ring_18
list x=292 y=536 w=76 h=44 cols=1 rows=1 th=44 gap=0 key=ring_19
list x=212 y=515 w=76 h=44 cols=1 rows=1 th=44 gap=0 key=ring_20
