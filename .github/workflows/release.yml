# Build Keyscope for MPC OS and attach the zip to a DRAFT release, with mpc-vst-plugins' reusable workflow
# (its docs/RELEASING.md, "Releasing from CI"). mpc-vst-plugins is pinned to ONE commit in both places below:
# the workflow itself, and tools_ref, which the workflow checks out for the skin and packaging tools. Bump
# both together when picking up a newer mpc-vst-plugins.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the zip and INSTALL.md, e.g. 0.3.0
        required: true
        type: string
      dry_run:
        description: Build and package only (zip and skin previews as run artifacts, no draft release)
        type: boolean
        default: false

jobs:
  vst:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@a4b8f861d07153a2b387d7520331f532f7247502
    permissions: { contents: write }
    with:
      tag: keyscope-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: a4b8f861d07153a2b387d7520331f532f7247502
      vst_dir: vst
      build: vst/build.sh
      host_test: vst/test.sh
      about: "Listens to any track and names its key, chord, bass note and tuning, from the spectrum of the whole mix."
      plugin_id: keyscope
      license: MIT
      dry_run: ${{ inputs.dry_run }}
