# Build Keyscope for MPC OS and attach the zip to a DRAFT release, with mpc-vst-plugins' reusable workflow
# (its docs/RELEASING.md, "Releasing from CI"). mpc-vst-plugins is pinned to ONE commit in both places below.
#
# Until sd88me/mpc-vst-plugins#90 is merged, upstream lacks the skin and wrapper features this port uses
# (lit list tiles, theme_tile_on, scale_names, 47-character readouts), and its host test needs the "host_test:
# give an effect input buffers" fix to run an effect. Both pins name the fork's keyscope-ci-base branch (that PR's
# head plus the fix): the workflow from the fork, and tools_ref, which the workflow checks out from upstream (a
# fork's commits are fetchable there). Point both pins at upstream once both are in.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the zip and INSTALL.md, e.g. 0.3.0
        required: true
        type: string
      dry_run:
        description: Build and package only (zip and skin previews as run artifacts, no draft release)
        type: boolean
        default: false

jobs:
  vst:
    uses: jacob-sabella/mpc-vst-plugins/.github/workflows/vst-release.yml@235502328e386c0830dc7bf6a61515a01a007ac6
    permissions: { contents: write }
    with:
      tag: keyscope-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 235502328e386c0830dc7bf6a61515a01a007ac6
      vst_dir: vst
      build: vst/build.sh
      host_test: vst/test.sh
      about: "Listens to any track and names its key, chord, bass note and tuning, from the spectrum of the whole mix."
      plugin_id: keyscope
      license: MIT
      dry_run: ${{ inputs.dry_run }}
