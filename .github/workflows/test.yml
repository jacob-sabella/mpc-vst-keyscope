# The offline tests (vst/test.sh) on every push and pull request: the detectors, the engine, every setting, bad
# input, the production build at real time under ASan and TSan, and the wrapper's host test.
#
# mpc-vst-plugins is pinned to the same commit as release.yml: move both pins together.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: mpc-vst-keyscope }
      - uses: actions/checkout@v4
        with:
          repository: sd88me/mpc-vst-plugins
          ref: 5b60c7bbbb6ec57f1defe4cd2d9e151f014fcdc7
          path: mpc-vst-plugins
      # TSan can't map its shadow memory with the runner's default 32 bits of mmap randomness
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: mpc-vst-keyscope/vst/test.sh
